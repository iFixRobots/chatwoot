name: Build Beeper filter hotfix
on:
  workflow_dispatch:
  push:
    branches: [fix/inbox-status-all]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Keep the deployed Enterprise edition
        run: printf '\nENV CW_EDITION="ee"\n' >> docker/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ifixrobots/chatwoot:filter-hotfix-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
