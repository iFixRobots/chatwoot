name: Build Beeper privacy ingestion hotfix
on:
  workflow_dispatch:
  push:
    branches: [fix/privacy-email-ingestion]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/privacy-ingestion-hotfix.Dockerfile
          build-args: HOTFIX_REV=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ifixrobots/chatwoot:privacy-ingestion-${{ github.sha }}
